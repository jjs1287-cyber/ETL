<html>Adds spaces to the beginning (left) of a string
				until the string contains n characters.
				Strings containing n characters or more are truncated to n characters.
        LPad(str, -n) is the same as RPad(str, n).<br><h2>Example:</h2><code><font size="4">LPad("01234567",9)</font></code> returns the string " 01234567".</html>
