returns the length of a string.<p>
StringLength function will return an array if the argument of the function is an array, whereas the Length function return the length of the array.
<p>
Example:
<p>
<code><font size="4">
x={a="abcd",b="e"};<br>
StringLength(x); // return an array {4,1} <br>
Length(x); // return an integer 2 <br>
</font></code>
