<html>Converts a string to proper case.<br><h2>Example:</h2><code><font size="4">
        ToProper("bob dylan") // Returns "Bob Dylan"<br>
        ToProper("arthur c. Clarke") // Returns "Arthur C. Clarke"<br>
        ToProper("Peter o'toole") // Returns "Peter O'Toole"<br>
        ToProper("paul mccartney") // Returns "Paul McCartney"<br>
        </font></code></html>
