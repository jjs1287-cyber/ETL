<html>Adds spaces to the end (right) of a string
				until the string contains n characters.
				Strings containing n characters or more are truncated to n characters.
        Rpad(str, -n) is the same as LPad(str, n).<br><h2>Example:</h2><code><font size="4">RPad("01234567",9)</font></code> returns the string "01234567 ".</html>
