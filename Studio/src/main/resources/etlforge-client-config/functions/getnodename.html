<html>Retrieve the name of a node. This method is typically used to retrieve the name of a node
				returned by <code><font size="4">SelectNodeFromXmlAny()</font></code> or
				<code><font size="4">SelectSingleNode()</font></code>.<br><h2>Example:</h2><code><font size="4">GetNodeName(SelectNodeFromXmlAny("Account",Root$Any.))</font></code></html>
