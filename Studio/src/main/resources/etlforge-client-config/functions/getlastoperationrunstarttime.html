<html><p>
        Returns the date and time (in GMT) that the given operation was last run.  The return value is a date (which includes date and time)
        </p><br><h2>Example:</h2><code><font size="4">        
        $LastOpRun = GetLastOperationRunStartTime("&lt;TAG&gt;MyProject/Operations/MyOperation&lt;/TAG&gt;");<br>
        </font></code></html>
