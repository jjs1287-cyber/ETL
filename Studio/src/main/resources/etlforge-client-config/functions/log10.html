<html>Generate the log (base10) of the data. If the data is not of data type double,
				it is converted to data type double before the log (base10) value is generated.<br><h2>Example:</h2><code><font size="4">log10(100)</font></code> returns a value of 2.
				<p>
				<code><font size="4">log10("5a")</font></code> will be treated as log10(5).</html>
