<html>
Creates an empty dictionary (map). Dictionaries have to be initialized before being used.
A Dictionary is a collection of name-value pairs where the value can be retrieved based on a string key value.
<br>
<h2>Example:</h2>
<code><font size="4">
$d = Dict();<br>
$d["key"] = "value";
$value = $d["key"];
</font>
</code>
</html>
