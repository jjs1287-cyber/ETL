<html>Remove an <i>attribute</i> of a certain type and with a certain value.<br><h2>Example:</h2><code><font size="4">LdapRemove("telephoneNumber","(510) 555 1000");</font></code>
				<br>
				<code><font size="4">LdapAdd("telephoneNumber","(510) 555 2000");</font></code>
				<br>
				<code><font size="4">LdapExecute("CN=wright,CN=Users,DC=finland,DC=company,DC=com");</font></code></html>
