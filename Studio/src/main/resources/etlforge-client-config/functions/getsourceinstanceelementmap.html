<html>
Returns a dictionary (map) containing the subelement name and its value from an element node.
<h2>Example:</h2>
<code><font size="4">
map = GetSourceInstanceElementMap([Values$Value.]);<br>
map["e1"]; // Returns the value of the "e1" sub element.
</font>
</code>
<br><br>
As an alternative to this function, see <code><font size="4">GetSourceInstanceElementArray()</html>
