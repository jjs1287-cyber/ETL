<html>Generate the natural log of the data. If the data is not of data type double,
				it is converted to data type double before the natural log value is generated.<br><h2>Example:</h2><code><font size="4">Log(100)</font></code> returns a value of 4.60517;
				<p>
				<code><font size="4">Log("5a")</font></code> will be treated as log(5).</html>
