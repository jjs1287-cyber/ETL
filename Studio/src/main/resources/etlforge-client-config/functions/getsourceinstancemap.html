Returns a dictionary (map) containing the attribute name and its value from an element node.
<h2>Example:</h2>
<code><font size="4">
map = GetSourceInstanceMap([Values$Value.]);<br>
map["Attr1"]; // Returns the value of the "Attr1" attribute.
