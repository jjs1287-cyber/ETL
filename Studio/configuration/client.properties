# Configuration file for the ETLForge.
# 
# Note: This file is not intended to be modified programmatically;
# 		these properties are read-only once the client has started.
# -----------------------------------------------------------------
#
# PORT_NUMBER:
# The current version of the integration client only allows one instace
# running at any time. In order to ensure that, the application will
# attempt to bind to a socket on startup. If that fails, it will assume
# that another instance of the application is already running. The 
# PORT_NUMBER property controls what port number is used for the socket.
# Change this number if the current value is already used by some
# other application.

# APACHE_PORT_NON_SSL:
# This is the port number that is used by default when connecting to a 
# ETLForge Server in non-ssh mode. This can be overridden in the login
# dialog by explicitly including the port number in the server field:
# 
# Example 1: The following uses the APACHE_PORT_NON_SSL when connecting:
# ETLForge Server: localhost
#
# Example 2: The following uses port 8080 when connecting:
# ETLForge Server: localhost:8080
APACHE_PORT_NON_SSL=47100

# APACHE_PORT_SSL:
# Same as APACHE_PORT_NON_SSL, but applicable for SSL connections.
APACHE_PORT_SSL=46909

# JRE
# Set this to the absolute path of the java command that you want to use, e.g.
# JRE=/usr/bin/java

# JRE_HOME
# Alternatively, set this to the home directory of your JRE installation, e.g.
# On Windows, use forward slash and use single quotes if the file path contains spaces (which it almost always does)
# JRE_HOME='C:/Program Files/Java/jre6'

# JRE takes precedence over JRE_HOME. If neither are set the the Java command to use
# is determined differently depending on the platform:
#
# Windows: 1. If the ETLForge Server version 5.0 or higher is installed on the same machine
#             the JRE that is shipped with it is used.
#          2. Check in the Windows registry for a Java installation. The newest version is used.
#
# Linux:   The java command in your system search path is used.
#
# Mac OS X: Uses it's own Java launcher and does not honor JRE/JRE_HOME.

# STARTUP_ARGUMENTS:
# Contains a string that is passed as input arguments when launching the
# client UI. This is intended to be used for setting VM arguments, such as
# system properties and memory settings.
# If this property is missing, the launcher uses the following as default:
#
# -Xmx512m -Dswing.boldMetal=false
#
# Note: This property is read by the CPP launcher. The value string must
# be enclosed in ' if it contains spaces or '='.
STARTUP_ARGUMENTS='-Xmx512m -Djava.util.Arrays.useLegacyMergeSort=true'
JRE_HOME=C:/ETL/Tools/jdk8u504-b01
PORT_NUMBER=37733


